version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: reciclapp_postgres
    environment:
      POSTGRES_DB: reciclapp
      POSTGRES_USER: reciclapp_user
      POSTGRES_PASSWORD: reciclapp_secure_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./setup.sql:/docker-entrypoint-initdb.d/01-setup.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reciclapp_user -d reciclapp"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: reciclapp_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@reciclapp.com
      PGADMIN_DEFAULT_PASSWORD: admin_password_2024
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data: