[project]
name = "reciclapp-api"
version = "0.1.0"
description = "FastAPI backend for ReciclApp - Recicla+ project by Nature Power Foundation"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.32.0",
    "pandas>=2.2.0",
    "gunicorn>=23.0.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.150.0",
    "google-cloud-storage>=2.18.0",
    "itsdangerous>=2.2.0",
    "firebase-admin>=6.5.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Note: This is an application, not a library.
# The build configuration above is required for editable installs with uv sync.
# For deployment, Google App Engine uses requirements.txt directly.
