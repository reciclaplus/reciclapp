name: Deploy Frontend to App Engine

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy"
        type: choice
        required: true
        options:
          - stage
          - prod
        default: stage

jobs:
  deploy:
    name: Deploy Frontend to App Engine
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: ${{ secrets.GCLOUD_PROJECT }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Inject secrets into app.yaml
        run: |
          echo '  NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "${{ env.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}"' >> app-stage.yaml
          echo '  NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "${{ env.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}"' >> app.yaml

      - name: Deploy to App Engine (stage)
        if: ${{ github.event.inputs.environment == 'stage' }}
        run: |
          gcloud app deploy app-stage.yaml --project "${{ env.GCP_PROJECT_ID }}" --quiet

      - name: Deploy to App Engine (prod)
        if: ${{ github.event.inputs.environment == 'prod' }}
        run: |
          gcloud app deploy app.yaml --project "${{ env.GCP_PROJECT_ID }}" --quiet
