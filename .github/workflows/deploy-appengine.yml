name: Deploy API to App Engine

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy"
        type: choice
        required: true
        options:
          - stage
          - prod
        default: stage

jobs:
  deploy:
    name: Deploy API to App Engine
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: ${{ secrets.GCLOUD_PROJECT }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Verify gcloud auth
        run: |
          gcloud config list
          gcloud auth list

      - name: Deploy to App Engine (stage)
        if: ${{ github.event.inputs.environment == 'stage' }}
        run: |
          gcloud app deploy fast_api/app-stage.yaml --project "${{ env.GCP_PROJECT_ID }}" --quiet

      - name: Deploy to App Engine (prod)
        if: ${{ github.event.inputs.environment == 'prod' }}
        run: |
          gcloud app deploy fast_api/app.yaml --project "${{ env.GCP_PROJECT_ID }}" --quiet
