name: Deploy API to GAE

on:
  push:
    tags:
      - "v*-api"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - production
          - development
        default: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "fast_api/requirements.txt"

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            # Default to production for tag-based deployments
            echo "environment=production" >> $GITHUB_OUTPUT
          fi

      - name: Switch to target environment
        run: |
          cd fast_api
          python switch_env.py ${{ steps.env.outputs.environment }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to App Engine
        run: |
          if [ "${{ steps.env.outputs.environment }}" == "production" ]; then
            DEPLOY_FILE="deployment/backend/app.yaml"
          else
            DEPLOY_FILE="deployment/backend/app-stage.yaml"
          fi

          cd fast_api
          gcloud app deploy ../$DEPLOY_FILE \
            --ignore-file=../deployment/backend/.gcloudignore \
            --quiet \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --version="${GITHUB_SHA::7}" \
            --promote

      - name: Deployment summary
        run: |
          echo "### API Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${GITHUB_SHA::7}" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** fastapi" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" == "push" ]; then
            echo "**Tag:** ${GITHUB_REF#refs/tags/}" >> $GITHUB_STEP_SUMMARY
          fi
